server:
  port: 8080
  shutdown: graceful            # rolling deploy — ochiq so'rovlar tugashini kutadi
  netty:
    connection-timeout: 5s
    idle-timeout: 30s           # sekin/osilgan clientlar connection'ni ushlab turmasin
management:
