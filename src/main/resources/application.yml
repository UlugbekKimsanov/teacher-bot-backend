spring:
  application:
    name: teacher-bot
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=2000,expireAfterWrite=10m
  lifecycle:
    timeout-per-shutdown-phase: 25s
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/teacher_bot
    username: postgres
    password: 1
    pool:
      enabled: true
      initial-size: 10
      max-size: 50                    # har instans uchun; gorizontal scale (ko'p instans) bilan
      max-acquire-time: 5s            # MUHIM: connection kutishni cheksiz qoldirmaydi
      max-create-connection-time: 5s
      max-idle-time: 30m
      max-life-time: 30m
      validation-query: SELECT 1
  flyway:
    url: jdbc:postgresql://localhost:5432/teacher_bot
    user: postgres
    password: 1
    baseline-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379
