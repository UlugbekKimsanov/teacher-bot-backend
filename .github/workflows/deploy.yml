name: Deploy Backend

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build jar (testlarsiz)
        run: mvn -B -DskipTests clean package

      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          JAR=$(ls -S target/*.jar | head -1)
          echo "Uploading $JAR ..."
          scp -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              -i ~/.ssh/id_ed25519 "$JAR" "$SSH_USER@$SSH_HOST:/opt/teacher-bot/app.jar"
          echo "Restarting service ..."
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -i ~/.ssh/id_ed25519 \
              "$SSH_USER@$SSH_HOST" \
              "systemctl restart teacher-bot && sleep 6 && systemctl is-active teacher-bot"
