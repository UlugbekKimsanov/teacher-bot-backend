services:
  app:
    build: .
    container_name: teacher-bot-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: teacher_bot
      DB_USER: postgres
      DB_PASS: ${DB_PASS:-postgres}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-7EDUTeacherBotSecretKeyForJWTTokenGeneration2024VeryLongSecretKey}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      ESKIZ_EMAIL: ${ESKIZ_EMAIL:-}
      ESKIZ_PASSWORD: ${ESKIZ_PASSWORD:-}
      ESKIZ_FROM: ${ESKIZ_FROM:-4546}
      ESKIZ_BASE_URL: ${ESKIZ_BASE_URL:-https://notify.eskiz.uz/api}
      GOOGLE_OAUTH_CLIENT_IDS: ${GOOGLE_OAUTH_CLIENT_IDS:-}
      CLICK_MERCHANT_ID: ${CLICK_MERCHANT_ID:-24180}
      CLICK_SERVICE_ID: ${CLICK_SERVICE_ID:-31879}
      CLICK_SECRET_KEY: ${CLICK_SECRET_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_BOT_POLLING_ENABLED: ${TELEGRAM_BOT_POLLING_ENABLED:-true}
    volumes:
      - app-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: teacher-bot-db
    environment:
      POSTGRES_DB: teacher_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
    # ports:
    #   - "5432:5432"  # faqat debug kerak bo'lsa oching
    # 100K user uchun (host RAM'iga qarab tuning qiling). App pool yig'indisi
    # (instans soni × max-size) bu max_connections'dan kam bo'lsin; ko'p instansda PgBouncer qo'shing.
    command: >
      postgres
      -c max_connections=300
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: teacher-bot-redis
    # ports:
    #   - "6379:6379"  # faqat debug kerak bo'lsa oching
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  pg-data:
  redis-data:
  app-storage:
