# Minimal shablon. Jonli sayt (/etc/nginx/sites-enabled/api.oazisedu.uz) Certbot
# tomonidan boshqariladigan TLS direktivalarini ham o'z ichiga oladi — bu faylni
# to'g'ridan-to'g'ri ustiga ko'chirmang; faqat ko'rib chiqilgan direktivalarni
# zaxira nusxa olgan holda jonli faylga qo'shing, so'ng `nginx -t` + reload.
#
# WebSocket uchun map (conf.d/ws-upgrade.conf da ham bo'lishi mumkin):
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name api.oazisedu.uz;

    # Lesson videos can be multi-gigabyte. Keep a finite ceiling to avoid
    # unbounded request bodies while allowing full-length HD lesson uploads.
    # Must stay in sync with FileStorageService.MAX_VIDEO_BYTES (2 GiB).
    client_max_body_size 2048M;

    # Video/audio/rasm oqimi: javob buferlanmasin (disk temp-fayl va kechikish yo'q),
    # Range so'rovlar backend (WebFlux ResourceWebHandler) tomonidan qo'llanadi.
    location /files/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # 2 GB yuklash diskka buferlanmasin — to'g'ridan-to'g'ri backendga uzatiladi.
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}
