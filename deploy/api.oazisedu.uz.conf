server {
    listen 80;
    server_name api.oazisedu.uz;

    # Lesson videos can be multi-gigabyte. Keep a finite ceiling to avoid
    # unbounded request bodies while allowing full-length HD lesson uploads.
    # Must stay in sync with FileStorageService.MAX_VIDEO_BYTES (2 GiB).
    client_max_body_size 2048M;

    # 2 GB yuklash diskka buferlanmasin — to'g'ridan-to'g'ri backendga uzatiladi.
    proxy_request_buffering off;

    location / {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}
