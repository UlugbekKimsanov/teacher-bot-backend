# !!! QO'LDA BIRLASHTIRISH KERAK !!!
# Bu fayl avtomatik deploy qilinmaydi. Jonli konfiguratsiya
# (/etc/nginx/sites-enabled/api.oazisedu.uz) Certbot tomonidan boshqariladi —
# quyidagi `location /files/` blokini jonli fayldagi `listen 443 ssl` server
# blokiga QO'LDA ko'chiring (avval zaxira nusxa oling), so'ng `nginx -t` va
# `systemctl reload nginx`. Batafsil: deploy/VIDEO_TRANSCODE.md
#
# Minimal shablon. Jonli sayt (/etc/nginx/sites-enabled/api.oazisedu.uz) Certbot
# tomonidan boshqariladigan TLS direktivalarini ham o'z ichiga oladi — bu faylni
# to'g'ridan-to'g'ri ustiga ko'chirmang; faqat ko'rib chiqilgan direktivalarni
# zaxira nusxa olgan holda jonli faylga qo'shing, so'ng `nginx -t` + reload.
#
# WebSocket uchun map (conf.d/ws-upgrade.conf da ham bo'lishi mumkin):
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name api.oazisedu.uz;

    # Lesson videos can be multi-gigabyte. Keep a finite ceiling to avoid
    # unbounded request bodies while allowing full-length HD lesson uploads.
    # Must stay in sync with FileStorageService.MAX_VIDEO_BYTES (2 GiB).
    client_max_body_size 2048M;

    # Statik fayllar (video/audio/rasm/kitob) — nginx TO'G'RIDAN-TO'G'RI diskdan beradi
    # (sendfile, Range, ETag — JVM/Netty'ni band qilmaydi; kichik VPS'da -Xmx384m uchun muhim).
    # Yo'l app.storage.base-path (STORAGE_PATH) bilan bir xil bo'lishi SHART.
    # Ikkala trailing slash ("/files/" va ".../storage/") alias traversal xatosining oldini oladi.
    # nginx worker (www-data) storage'ni o'qiy olishi kerak: papkalar 755, fayllar 644.
    location /files/ {
        alias /opt/teacher-bot/storage/;
        autoindex off;

        sendfile on;
        tcp_nopush on;
        # aio threads;   # ixtiyoriy: nginx --with-threads bilan yig'ilgan bo'lsa (nginx -V) yoqing
        # Faqat egasi bir xil bo'lgan symlinklarga ruxsat (storage tashqarisiga sakrashni to'sadi)
        disable_symlinks if_not_owner;

        # Fayl nomlari noyob (uid) va joyida qayta yozilmaydi — uzoq muddatli immutable kesh xavfsiz.
        # `expires` ishlatilmadi: u ikkinchi Cache-Control sarlavhasini qo'shib, takrorlanadi.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;

        # Preflight (CORS) — 204. `if` ichida add_header qayta yoziladi (meros qolmaydi).
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        # Yashirin fayllar va tugallanmagan ffmpeg chiqishi (.part) berilmaydi
        location ~ (/\.|\.part$) {
            return 404;
        }

        # Aniq MIME turlari (bu blok global mime.types'ni shu location uchun ALMASHTIRADI,
        # shuning uchun storage'dagi barcha turlar sanab o'tilgan)
        types {
            video/mp4        mp4 m4v;
            video/quicktime  mov;
            video/webm       webm;
            video/x-matroska mkv;
            video/x-msvideo  avi;
            audio/mpeg       mp3;
            audio/mp4        m4a;
            audio/aac        aac;
            audio/wav        wav;
            audio/ogg        ogg oga opus;
            audio/flac       flac;
            image/jpeg       jpg jpeg;
            image/png        png;
            image/webp       webp;
            image/gif        gif;
            application/pdf  pdf;
            application/epub+zip epub;
        }
        default_type application/octet-stream;
    }

    # Zaxira (fallback): muammo bo'lsa yuqoridagi blok o'rniga backend orqali berish.
    # location /files/ {
    #     proxy_pass http://127.0.0.1:8080;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header Connection "";
    #     proxy_buffering off;
    #     proxy_max_temp_file_size 0;
    #     proxy_read_timeout 3600s;
    #     proxy_send_timeout 3600s;
    # }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # 2 GB yuklash diskka buferlanmasin — to'g'ridan-to'g'ri backendga uzatiladi.
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}
